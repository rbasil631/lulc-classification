[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lulc-classification"
version = "2.0.0"
description = "LULC semantic segmentation on Sentinel-2 imagery with explainable AI"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Syed Basil Rizvi" }]
keywords = ["remote-sensing", "sentinel-2", "semantic-segmentation", "xai", "lulc"]

dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "segmentation-models-pytorch>=0.3.3",
    "torchmetrics>=1.0",
    "rasterio>=1.3",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "albumentations>=1.4",
    "PyYAML>=6.0",
    "tqdm>=4.65",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

[project.optional-dependencies]
pretrained = ["torchgeo>=0.5"]
xai = ["grad-cam>=1.5", "shap>=0.44"]
dev = ["ruff>=0.4", "pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
